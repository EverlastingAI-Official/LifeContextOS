[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lifecontext-l1"
version = "0.1.0"
description = "Local-first life context management and L1 digital persona runtime"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
lifecontext = "lifecontext_api.cli:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["apps/api"]

[tool.setuptools]
package-dir = {"" = "apps/api"}

[tool.setuptools.packages.find]
where = ["apps/api"]
